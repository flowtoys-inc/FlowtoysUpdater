# Keeps the SHA-pinned GitHub Actions and the ThirdParty/ git submodules
# (JUCE, hidapi) up to date via automated PRs against master, one grouped
# PR per ecosystem a week.
# Note: the Catch2 pin in Tests/CMakeLists.txt (CMake FetchContent) and the
# clang-format pin in build.yml are not covered by dependabot and are bumped
# manually.
# PR checks skip Dependabot PRs, so the commit-message prefixes keep their
# squash titles Conventional (ci:/build: are hidden from release-please, so
# a bump alone never cuts a release).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: master
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    target-branch: master
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      submodules:
        patterns: ['*']
