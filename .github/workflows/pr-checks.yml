# Conventional Commit PR title + TruffleHog secret scan, in one job, from
# flowtoys-inc/dev-standards. PRs are squash-merged, so the title becomes
# the commit release-please reads.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    # Runs on Dependabot PRs too: dependabot.yml prefixes their commits
    # ci(deps)/build(deps), so the titles pass, and they get the secret scan.
    uses: flowtoys-inc/dev-standards/.github/workflows/pr-checks.yml@f632c110c01ca9ca4964d63d0cd74ec1bbd402b9 # v0.1.1
