# Conventional Commit PR title + TruffleHog secret scan, in one job.
#
# Inlined copy of flowtoys-inc/dev-standards' reusable pr-checks.yml: this
# repo is public and can't call workflows in the private dev-standards repo.
# Once dev-standards is public, replace the job with:
#
#   pr-checks:
#     uses: flowtoys-inc/dev-standards/.github/workflows/pr-checks.yml@<sha> # vX.Y.Z
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # PRs are squash-merged, so the title becomes the commit release-please reads.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
      # Scan even if the title check failed; `edited` changes no commits.
      - if: (success() || failure()) && github.event.action != 'edited'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TruffleHog diffs the PR's commit range; a shallow clone gives it nothing to compare.
          fetch-depth: 0
          persist-credentials: false
      - if: (success() || failure()) && github.event.action != 'edited'
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # verified = a live credential; unknown = could not be checked, still wants eyes.
          extra_args: --results=verified,unknown
