name: Build

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: clang-format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pinned version as docs/BUILDING.md, so local and CI agree.
      - name: Check formatting
        run: pipx run clang-format==23.1.3 --dry-run --Werror Source/*.cpp Source/*.h Tests/*.cpp

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Linux only: the shipped binary links the build machine's glibc, which
    # only works forward. Building inside the oldest supported distro keeps
    # the artifact running on older systems while the host runner stays on
    # the newest image.
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # PRs build arm64 only (half the compile); master and releases
          # stay universal, so the shipped architecture set is still built
          # on every merge.
          - name: macOS
            os: macos-26
            cmake_flags: ${{ github.event_name == 'pull_request' && '-DCMAKE_OSX_ARCHITECTURES=arm64' || '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' }}
          # sccache, not ccache: it understands MSVC's command line.
          - name: Windows
            os: windows-2025
            compiler_cache: sccache
            # Embedded (/Z7) debug info, so sccache can cache every object.
            cmake_flags: -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          # Newest toolchain, for warnings; not packaged.
          - name: Linux
            os: ubuntu-26.04
            cmake_flags: ""
          # Ships: glibc 2.35 baseline (see `container` above).
          - name: Linux (Ubuntu 22.04)
            os: ubuntu-26.04
            container: ubuntu:22.04
            package: true
            cmake_flags: ""
    env:
      CMAKE_FLAGS: ${{ matrix.cmake_flags }}
      COMPILER_CACHE: ${{ matrix.compiler_cache || 'ccache' }}
    steps:
      # The bare container has no git, without which checkout falls back to
      # a tarball and skips the submodules.
      - name: Install container tools
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git sudo build-essential cmake zip ccache ninja-build

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The .debs are cached (saved from master only, like the compiler
      # cache) in a runner-owned directory, so warm runs skip the download.
      # The key changes whenever this file, and so the package list, does.
      - name: Restore apt package cache
        if: runner.os == 'Linux'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-${{ matrix.name }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-${{ matrix.name }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        env:
          APT_ARCHIVES: ${{ runner.temp }}/apt-archives
        run: |
          mkdir -p "$APT_ARCHIVES/partial"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$APT_ARCHIVES" \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxext-dev libxi-dev \
            libcurl4-openssl-dev libasound2-dev \
            libusb-1.0-0-dev libudev-dev pkg-config \
            ninja-build

      - name: Save apt package cache
        if: runner.os == 'Linux' && github.ref == 'refs/heads/master' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-${{ matrix.name }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      # Ninja on Windows needs the MSVC environment (cl.exe, link.exe, and
      # the Ninja that ships with Visual Studio) on PATH.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Caches are saved only from master and restored everywhere, so PRs
      # start warm without filling the 10 GB repo cache with per-PR copies.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.compiler_cache || 'ccache' }}
          save: ${{ github.ref == 'refs/heads/master' }}
          max-size: 1G
          evict-old-files: job

      # eval re-splits CMAKE_FLAGS, which can hold several quoted arguments.
      - name: Configure
        shell: bash
        run: >-
          eval cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLOWTOYS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER_LAUNCHER="$COMPILER_CACHE" -DCMAKE_CXX_COMPILER_LAUNCHER="$COMPILER_CACHE"
          "$CMAKE_FLAGS"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Package inside the runner so unix executable permissions survive:
      # the artifact store itself strips them, an inner zip preserves them.
      # The build only leaves a linker-generated ad-hoc signature on the
      # executable; without a sealed bundle signature, quarantined downloads
      # are killed at launch on newer macOS (#24). Seal it ad-hoc.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app
          codesign --verify --deep --strict build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app
          ditto -c -k --keepParent build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app FlowtoysUpdater-osx.zip

      - name: Package (Linux)
        if: matrix.package
        run: cd build/FlowtoysUpdater_artefacts/Release && zip -r "$GITHUB_WORKSPACE/FlowtoysUpdater-linux.zip" FlowtoysUpdater

      # Also builds the Inno Setup installer, so install.iss is validated on
      # every PR instead of only at release time.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(FlowtoysUpdater VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          iscc /DApplicationVersion=$v install.iss
          Compress-Archive -Path build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.exe -DestinationPath FlowtoysUpdater-win-x64.zip

      - name: Upload artifact
        if: runner.os != 'Linux' || matrix.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FlowtoysUpdater-${{ runner.os }}
          path: |
            FlowtoysUpdater-*.zip
            Output/FlowtoysUpdater-win-x64-*.exe
