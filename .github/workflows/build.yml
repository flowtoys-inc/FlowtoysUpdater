name: Build

on:
  push:
    branches: [modernize, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            cmake_flags: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-2022
            cmake_flags: ""
          # Oldest supported runner on purpose: the shipped binary links the
          # build machine's glibc, and glibc only works forward — building on
          # a newer image would exclude users on older distros. Bump only when
          # GitHub retires the image (or move to a container build).
          - name: Linux
            os: ubuntu-22.04
            cmake_flags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxext-dev \
            libcurl4-openssl-dev libasound2-dev \
            libusb-1.0-0-dev libudev-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Package inside the runner so unix executable permissions survive:
      # the artifact store itself strips them, an inner zip preserves them.
      # The build only leaves a linker-generated ad-hoc signature on the
      # executable; without a sealed bundle signature, quarantined downloads
      # are killed at launch on newer macOS (#24). Seal it ad-hoc.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app
          codesign --verify --deep --strict build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app
          ditto -c -k --keepParent build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app FlowtoysUpdater-osx.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd build/FlowtoysUpdater_artefacts/Release && zip -r "$GITHUB_WORKSPACE/FlowtoysUpdater-linux.zip" FlowtoysUpdater

      # Also builds the Inno Setup installer, so install.iss is validated on
      # every PR instead of only at release time.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(FlowtoysUpdater VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          iscc /DApplicationVersion=$v install.iss
          Compress-Archive -Path build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.exe -DestinationPath FlowtoysUpdater-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FlowtoysUpdater-${{ runner.os }}
          path: |
            FlowtoysUpdater-*.zip
            Output/FlowtoysUpdater-win-x64-*.exe
