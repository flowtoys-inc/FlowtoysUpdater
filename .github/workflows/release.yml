# Release builds, called by release-please.yml once a release PR merges
# (release-please has already created the tag and the GitHub Release; this
# attaches the binaries).
#
# Artifact names follow the in-app self-updater's contract exactly
# (Source/AppUpdater.cpp getDownloadFileName):
#   FlowtoysUpdater-osx-<version>.zip / .pkg
#   FlowtoysUpdater-win-x64-<version>.exe
#   FlowtoysUpdater-linux-<version>.zip
#
# macOS signing + notarization run only when the corresponding secrets
# exist (see docs/RELEASING.md); without them the release is unsigned,
# which works for right-click-open installs but is Gatekeeper-blocked
# on normal download. Windows Authenticode signing (Azure Artifact
# Signing) is gated the same way; without it the exe and installer are
# unsigned and SmartScreen shows "Unknown publisher". Publishing to
# flow-toys.com (and updating the server's update.json) remains a
# manual step.
#
# Tags pushed by hand don't trigger anything: release-please owns versions
# and tags (docs/RELEASING.md).
#
# Anything not called with a tag is a dry run: it builds, signs and
# notarizes exactly like a real release, using the CMakeLists.txt
# version, but only uploads workflow artifacts and never publishes a
# GitHub Release. Start one by pushing any commit to the release-dry-run
# branch (git push -f origin <ref>:release-dry-run), or with Actions →
# Release → Run workflow once this file is on the default branch
# (GitHub only offers manual runs for workflows that exist there).

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the binaries to, e.g. v1.2.0
        type: string
        required: true
    # Optional: without them the release is unsigned (see the header).
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      NOTARY_APPLE_ID:
        required: false
      NOTARY_PASSWORD:
        required: false
      NOTARY_TEAM_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      ARTIFACT_SIGNING_ENDPOINT:
        required: false
      ARTIFACT_SIGNING_ACCOUNT:
        required: false
      ARTIFACT_SIGNING_PROFILE:
        required: false
  push:
    branches: [release-dry-run]
  workflow_dispatch:

# Jobs get only what they need: publish writes the release, windows
# requests an OIDC token for Azure.
permissions:
  contents: read

jobs:
  check-version:
    name: Verify tag matches project version
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare tag with CMakeLists.txt VERSION
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          CMAKE_VERSION=$(sed -nE 's/^project\(FlowtoysUpdater VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ -n "$TAG" ]; then
            echo "CMakeLists.txt version: $CMAKE_VERSION — tag: $TAG"
            if [ "$CMAKE_VERSION" != "${TAG#v}" ]; then
              echo "::error::Tag '$TAG' != project VERSION '$CMAKE_VERSION'. The self-updater derives download filenames from the compiled-in version; a mismatch publishes artifacts the app can never find. Check the x-release-please-version marker in CMakeLists.txt."
              exit 1
            fi
          else
            echo "Dry run of $GITHUB_REF_NAME at CMakeLists.txt version $CMAKE_VERSION (nothing will be published)"
          fi
          echo "version=$CMAKE_VERSION" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: check-version
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Step-level `if` cannot read the secrets context, so surface
      # presence through env. Values are only "true"/"false".
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      HAVE_NOTARIZATION: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_PASSWORD != '' && secrets.NOTARY_TEAM_ID != '' }}
      # Set by the import step once it has looked inside the .p12.
      HAVE_INSTALLER_SIGNING: 'false'
      APP: build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Import signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci-keychain-pass build.keychain
          # Don't auto-lock mid-job (the default locks after 5 minutes idle).
          security set-keychain-settings -lut 21600 build.keychain
          # Put build.keychain first in the search list, keeping the rest.
          # shellcheck disable=SC2046 # one keychain path per word, no spaces
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain-pass build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain-pass build.keychain
          rm certificate.p12
          # Keychain Access exports only the leaf certs, and runner images
          # don't reliably ship Apple's Developer ID intermediate, without
          # which codesign can't build the chain. Pinned by fingerprint.
          curl -fsSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  DeveloperIDG2CA.cer" | shasum -a 256 -c
          security import DeveloperIDG2CA.cer -k build.keychain
          rm DeveloperIDG2CA.cer
          security find-identity -v -p codesigning build.keychain
          if ! security find-identity -v -p codesigning build.keychain | grep -q '"Developer ID Application: '; then
            echo "::error::MACOS_CERTIFICATE has no valid Developer ID Application identity."
            exit 1
          fi
          # The Installer cert is optional: without it the .pkg ships unsigned
          # and un-notarized, but the app inside it (and the zip) still are.
          if security find-identity -v -p basic build.keychain | grep -q '"Developer ID Installer: '; then
            echo "HAVE_INSTALLER_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::MACOS_CERTIFICATE has no Developer ID Installer identity; the .pkg will be unsigned."
          fi

      - name: Sign app
        if: env.HAVE_SIGNING == 'true'
        run: codesign --force --deep --options runtime --timestamp --sign "Developer ID Application" "$APP"

      - name: Package zip and pkg
        run: |
          V="$VERSION"
          if [ "$HAVE_SIGNING" != "true" ]; then
            # No Developer ID: seal the bundle with an ad-hoc signature, or
            # quarantined downloads get killed at launch on newer macOS (#24).
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "FlowtoysUpdater-osx-$V.zip"
          # Same postinstall auto-launch behavior as the old Packages.app pkg.
          mkdir -p pkg-scripts
          cp launchApp.sh pkg-scripts/postinstall
          chmod +x pkg-scripts/postinstall
          SIGN_ARGS=()
          if [ "$HAVE_INSTALLER_SIGNING" = "true" ]; then SIGN_ARGS=(--sign "Developer ID Installer" --timestamp); fi
          pkgbuild --component "$APP" \
                   --install-location /Applications \
                   --identifier com.benkuper.flowtoysupdater \
                   --version "$V" \
                   --scripts pkg-scripts \
                   "${SIGN_ARGS[@]}" \
                   "FlowtoysUpdater-osx-$V.pkg"

      - name: Notarize and staple
        # Apple rejects anything not signed with a Developer ID, so there is
        # nothing to notarize without the signing secrets.
        if: env.HAVE_SIGNING == 'true' && env.HAVE_NOTARIZATION == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          V="$VERSION"
          AUTH=(--apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID")
          # notarytool can exit 0 on a rejected submission; check the status
          # and print Apple's log so a rejection is debuggable from CI.
          notarize() {
            local out id status
            out=$(xcrun notarytool submit "$1" "${AUTH[@]}" --wait --output-format json)
            echo "$out"
            id=$(echo "$out" | plutil -extract id raw -)
            status=$(echo "$out" | plutil -extract status raw -)
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" "${AUTH[@]}"
              echo "::error::Notarization of $1 finished as '$status'."
              return 1
            fi
          }
          notarize "FlowtoysUpdater-osx-$V.zip"
          xcrun stapler staple "$APP"
          rm "FlowtoysUpdater-osx-$V.zip"
          ditto -c -k --keepParent "$APP" "FlowtoysUpdater-osx-$V.zip"
          if [ "$HAVE_INSTALLER_SIGNING" = "true" ]; then
            notarize "FlowtoysUpdater-osx-$V.pkg"
            xcrun stapler staple "FlowtoysUpdater-osx-$V.pkg"
          fi

      - name: Verify signatures
        if: env.HAVE_SIGNING == 'true'
        run: |
          V="$VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime)'
          if [ "$HAVE_NOTARIZATION" = "true" ]; then xcrun stapler validate "$APP"; fi
          if [ "$HAVE_INSTALLER_SIGNING" = "true" ]; then
            pkgutil --check-signature "FlowtoysUpdater-osx-$V.pkg"
            if [ "$HAVE_NOTARIZATION" = "true" ]; then xcrun stapler validate "FlowtoysUpdater-osx-$V.pkg"; fi
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            FlowtoysUpdater-osx-*.zip
            FlowtoysUpdater-osx-*.pkg

  windows:
    name: Windows
    needs: check-version
    runs-on: windows-2025
    timeout-minutes: 60
    # Azure's federated credential trusts this environment, so one
    # credential covers release-please calls, release-dry-run and manual runs.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # Same pattern as macOS: presence only, values "true"/"false".
      HAVE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.ARTIFACT_SIGNING_ENDPOINT != '' && secrets.ARTIFACT_SIGNING_ACCOUNT != '' && secrets.ARTIFACT_SIGNING_PROFILE != '' }}
      EXE: build\FlowtoysUpdater_artefacts\Release\FlowtoysUpdater.exe
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Azure login
        if: env.HAVE_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # Signing needs only the app's role on the signing account.
          allow-no-subscriptions: true

      # The app exe is signed before Inno Setup packs it, so the installed
      # copy (and what the self-updater launches) carries the signature.
      - name: Sign app
        if: env.HAVE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ env.EXE }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FlowtoysUpdater
          description-url: https://flowtoys.com

      - name: Build installer
        run: iscc /DApplicationVersion=$env:VERSION install.iss

      - name: Sign installer
        if: env.HAVE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\Output\FlowtoysUpdater-win-x64-${{ env.VERSION }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FlowtoysUpdater Setup
          description-url: https://flowtoys.com

      - name: Verify signatures
        if: env.HAVE_SIGNING == 'true'
        run: |
          # signtool isn't on PATH; take the newest Windows SDK copy.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1 -ExpandProperty FullName
          foreach ($f in @($env:EXE, "Output\FlowtoysUpdater-win-x64-$env:VERSION.exe")) {
            & $signtool verify /pa /v $f
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $f" }
            # A signature without a timestamp dies with the 3-day certificate.
            $sig = Get-AuthenticodeSignature $f
            if ($null -eq $sig.TimeStamperCertificate) { throw "$f is not timestamped" }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Signing skipped
        if: env.HAVE_SIGNING != 'true'
        run: Write-Host "::warning::Artifact Signing secrets not set; the Windows exe and installer are unsigned (SmartScreen will warn)."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: Output/FlowtoysUpdater-win-x64-*.exe

  linux:
    name: Linux
    needs: check-version
    runs-on: ubuntu-26.04
    # glibc only works forward: build inside the oldest supported distro so
    # the binary still runs there (same as the shipped CI artifact).
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      # Without git, checkout falls back to a tarball and skips submodules.
      - name: Install container tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git sudo build-essential cmake zip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxext-dev libxi-dev \
            libcurl4-openssl-dev libasound2-dev \
            libusb-1.0-0-dev libudev-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          cd build/FlowtoysUpdater_artefacts/Release
          zip -r "$GITHUB_WORKSPACE/FlowtoysUpdater-linux-$VERSION.zip" FlowtoysUpdater

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: FlowtoysUpdater-linux-*.zip

  publish:
    name: Attach binaries to the GitHub Release
    # Only release-please's call passes a tag. Dry runs (release-dry-run
    # pushes, manual runs) keep their artifacts on the workflow run.
    if: inputs.tag != ''
    needs: [macos, windows, linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # release-please created the release (with its changelog notes).
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" artifacts/* --clobber
