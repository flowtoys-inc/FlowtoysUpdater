# Tag-triggered release builds.
#
# Artifact names follow the in-app self-updater's contract exactly
# (Source/AppUpdater.cpp getDownloadFileName):
#   FlowtoysUpdater-osx-<version>.zip / .pkg
#   FlowtoysUpdater-win-x64-<version>.exe
#   FlowtoysUpdater-linux-<version>.zip
#
# macOS signing + notarization run only when the corresponding secrets
# exist (see docs/RELEASING.md); without them the release is unsigned,
# which works for right-click-open installs but is Gatekeeper-blocked
# on normal download. Publishing to flow-toys.com (and updating the
# server's update.json) remains a manual step.

name: Release

on:
  push:
    tags: ['[0-9]*.*.*']

permissions:
  contents: write

jobs:
  check-version:
    name: Verify tag matches project version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with CMakeLists.txt VERSION
        run: |
          CMAKE_VERSION=$(sed -nE 's/^project\(FlowtoysUpdater VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "CMakeLists.txt version: $CMAKE_VERSION — tag: $GITHUB_REF_NAME"
          if [ "$CMAKE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' != project VERSION '$CMAKE_VERSION'. The self-updater derives download filenames from the compiled-in version; a mismatch publishes artifacts the app can never find. Bump CMakeLists.txt and re-tag."
            exit 1
          fi

  macos:
    name: macOS
    needs: check-version
    runs-on: macos-15
    env:
      # Step-level `if` cannot read the secrets context, so surface
      # presence through env. Values are only "true"/"false".
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      HAVE_NOTARIZATION: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_PASSWORD != '' && secrets.NOTARY_TEAM_ID != '' }}
      APP: build/FlowtoysUpdater_artefacts/Release/FlowtoysUpdater.app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Import signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci-keychain-pass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain-pass build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain-pass build.keychain
          rm certificate.p12

      - name: Sign app
        if: env.HAVE_SIGNING == 'true'
        run: codesign --force --deep --options runtime --timestamp --sign "Developer ID Application" "$APP"

      - name: Package zip and pkg
        run: |
          V="$GITHUB_REF_NAME"
          ditto -c -k --keepParent "$APP" "FlowtoysUpdater-osx-$V.zip"
          # Same postinstall auto-launch behavior as the old Packages.app pkg.
          mkdir -p pkg-scripts
          cp launchApp.sh pkg-scripts/postinstall
          chmod +x pkg-scripts/postinstall
          SIGN_ARGS=()
          if [ "$HAVE_SIGNING" = "true" ]; then SIGN_ARGS=(--sign "Developer ID Installer"); fi
          pkgbuild --component "$APP" \
                   --install-location /Applications \
                   --identifier com.benkuper.flowtoysupdater \
                   --version "$V" \
                   --scripts pkg-scripts \
                   "${SIGN_ARGS[@]}" \
                   "FlowtoysUpdater-osx-$V.pkg"

      - name: Notarize and staple
        if: env.HAVE_NOTARIZATION == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          V="$GITHUB_REF_NAME"
          AUTH=(--apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID")
          xcrun notarytool submit "FlowtoysUpdater-osx-$V.zip" "${AUTH[@]}" --wait
          xcrun stapler staple "$APP"
          ditto -c -k --keepParent "$APP" "FlowtoysUpdater-osx-$V.zip"
          xcrun notarytool submit "FlowtoysUpdater-osx-$V.pkg" "${AUTH[@]}" --wait
          xcrun stapler staple "FlowtoysUpdater-osx-$V.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            FlowtoysUpdater-osx-*.zip
            FlowtoysUpdater-osx-*.pkg

  windows:
    name: Windows
    needs: check-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer
        run: iscc /DApplicationVersion=$env:GITHUB_REF_NAME install.iss

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Output/FlowtoysUpdater-win-x64-*.exe

  linux:
    name: Linux
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxext-dev \
            libcurl4-openssl-dev libasound2-dev \
            libusb-1.0-0-dev libudev-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          cd build/FlowtoysUpdater_artefacts/Release
          zip -r "$GITHUB_WORKSPACE/FlowtoysUpdater-linux-$GITHUB_REF_NAME.zip" FlowtoysUpdater

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: FlowtoysUpdater-linux-*.zip

  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
